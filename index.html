<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RETRY | Repository Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --body-bg: #f1f5f9;
            --studio-bg: #cbd5e1; 
            --paper-bg: #ffffff;
            --text-color: #1e293b;
            --header-bg: #334155;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --icon-color: #64748b;
            --code-bg: #f1f5f9;
        }

        .dark-mode {
            --body-bg: #020617; 
            --studio-bg: #0f172a; 
            --paper-bg: #1e293b; 
            --text-color: #f8fafc; 
            --header-bg: #000000;
            --panel-bg: #0f172a;
            --border-color: #334155;
            --icon-color: #94a3b8;
            --code-bg: #334155;
        }

        /* Allow natural page scrolling */
        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            overflow-y: auto; 
            overflow-x: hidden;
            display: flex; 
            flex-direction: column; 
            transition: all 0.3s ease; 
            background: var(--body-bg); 
            margin: 0;
        }
        
        nav { position: sticky; top: 0; z-index: 1000; }

        /* TOP SECTION: ARCHITECTURAL MAP */
        #map-section {
            width: 100%;
            height: 70vh; /* Takes 70% of initial view */
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #cy { width: 100%; flex-grow: 1; }

        /* BOTTOM SECTION: THE STUDIO VIEWPORT */
        #doc-studio { 
            width: 100%;
            min-height: 150vh; /* Massive height for deep scrolling */
            background: var(--studio-bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 100px 0; 
            transition: background 0.3s;
        }

        #doc-page { 
            background: var(--paper-bg) !important;
            width: 210mm; 
            min-height: 297mm; 
            height: auto; 
            padding: 25mm; 
            box-shadow: 0 20px 70px rgba(0, 0, 0, 0.25);
            transform-origin: top center; 
            transition: all 0.3s ease-out;
            color: var(--text-color);
            margin-bottom: 100px;
        }

        /* UI ELEMENTS */
        .panel-header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 40px; }
        .header-bg { background-color: var(--header-bg); }
        .nav-icon { color: var(--icon-color); padding: 8px 12px; font-size: 1.2rem; cursor: pointer; border: none; background: none; }
        .nav-icon:hover { color: #3b82f6; }
        .formal-blue-btn { background-color: #cbd5e1; color: #1e293b; font-weight: 800; }

        /* TEXT VISIBILITY */
        #doc-container, #doc-container h1, #doc-container h2, #doc-container h3, 
        #doc-container p, #doc-container li, #doc-container strong {
            color: var(--text-color) !important;
        }
        
        #doc-container pre {
            background-color: var(--code-bg) !important;
            padding: 20px; border-radius: 8px; border: 1px solid var(--border-color);
        }

        @media print {
            nav, #map-section, .panel-header, #doc-controls { display: none !important; }
            body, #doc-studio { background: white !important; overflow: visible !important; display: block !important; padding: 0 !important; }
            #doc-page { transform: scale(1) !important; box-shadow: none !important; width: 100% !important; margin: 0 !important; }
        }
    </style>
</head>
<body>

    <nav class="p-4 header-bg flex justify-between items-center shadow-xl">
        <div class="flex items-center"><span class="text-white font-extrabold tracking-[0.5em] text-xl ml-6">RETRY</span></div>
        <div class="flex items-center rounded-xl overflow-hidden shadow-2xl bg-white">
            <input id="repo-url" type="text" placeholder="PASTE REPOSITORY LINK" class="px-6 py-3 text-sm w-[400px] outline-none border-none text-slate-700">
            <button onclick="ingestRepo()" id="btn-ingest" class="formal-blue-btn px-10 py-3 text-xs uppercase tracking-widest border-l border-slate-200">Analyze</button>
        </div>
        <div class="flex items-center gap-4 mr-6">
            <button onclick="toggleDarkMode()" class="text-2xl cursor-pointer">🌓</button>
        </div>
    </nav>

    <div id="map-section">
        <div class="panel-header flex justify-between items-center">
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Architectural Map</span>
            <div class="flex gap-2">
                <button onclick="zoomGraph(1.2)" class="nav-icon">🔍+</button>
                <button onclick="zoomGraph(0.8)" class="nav-icon">🔍-</button>
            </div>
        </div>
        <div id="cy"></div>
    </div>

    <div id="doc-studio">
        <div id="doc-controls" class="w-full max-w-[210mm] flex justify-between mb-8 px-4">
            <div class="flex items-center gap-4">
                <input type="range" min="0.4" max="1.3" step="0.05" value="0.8" class="w-32" id="zoomRange" oninput="updateZoom(this.value)">
                <span id="zoomVal" class="text-xs font-bold text-slate-500">80%</span>
            </div>
            <button onclick="window.print()" class="nav-icon font-bold text-sm bg-white px-4 rounded shadow-sm">📥 EXPORT PDF</button>
        </div>

        <div id="doc-page">
            <div id="doc-container" class="prose max-w-none">
                <h1>Repository Documentary</h1>
                <p class="text-center italic mt-10 opacity-70">Scroll down to view the full document. Results will appear here after analysis.</p>
            </div>
        </div>
    </div>

    <script>
        let cy = null;
        let isDarkMode = false;

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            if (cy) {
                cy.style()
                    .selector('node').style('color', isDarkMode ? '#f8fafc' : '#1e293b')
                    .selector('edge').style('line-color', isDarkMode ? '#475569' : '#cbd5e1').update();
            }
        }

        function zoomGraph(factor) { if (cy) cy.zoom(cy.zoom() * factor); }

        function updateZoom(val) {
            document.getElementById('doc-page').style.transform = `scale(${val})`;
            document.getElementById('zoomVal').innerText = Math.round(val * 100) + '%';
        }

        async function ingestRepo() {
            const url = document.getElementById('repo-url').value;
            if (!url) return;
            const btn = document.getElementById('btn-ingest');
            btn.innerText = "RUNNING...";
            try {
                const res = await fetch('http://127.0.0.1:8000/ingest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) });
                const data = await res.json();
                const genRes = await fetch(`http://127.0.0.1:8000/generate/${data.repo}`);
                const genData = await genRes.json();
                document.getElementById('doc-container').innerHTML = `<h1>Repository Documentary</h1><div class="mt-12">${marked.parse(genData.markdown)}</div>`;
                
                // Automatically scroll to the document once it's ready
                document.getElementById('doc-studio').scrollIntoView({ behavior: 'smooth' });
                loadGraph();
            } catch (e) { alert("Server Error"); }
            finally { btn.innerText = "Analyze"; }
        }

        async function loadGraph() {
            const res = await fetch('http://127.0.0.1:8000/graph-data');
            const elements = await res.json();
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    { selector: 'node', style: { 
                        'label': 'data(label)', 'color': isDarkMode ? '#f8fafc' : '#1e293b', 
                        'font-size': '10px', 'width': 18, 'height': 18,
                        'background-color': (n) => n.data('label').includes('.') ? '#f59e0b' : '#3b82f6',
                        'text-valign': 'bottom', 'text-margin-y': '6px'
                    }},
                    { selector: 'edge', style: { 'width': 2, 'line-color': isDarkMode ? '#475569' : '#cbd5e1', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' }}
                ],
                layout: { name: 'cose', padding: 50 }
            });
        }

        window.onload = () => updateZoom(0.8);
    </script>
</body>
</html>
