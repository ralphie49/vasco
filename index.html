<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RETRY | Repository Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        :root {
            --body-bg: #f1f5f9;
            --studio-bg: #cbd5e1; 
            --paper-bg: #ffffff;
            --text-color: #0f172a; 
            --header-bg: #334155;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --icon-color: #64748b;
            --code-bg: #f1f5f9;    
            --code-text: #000000;  
        }

        .dark-mode {
            --body-bg: #020617; 
            --studio-bg: #0f172a; 
            --paper-bg: #1e293b; 
            --text-color: #f8fafc; 
            --header-bg: #000000;
            --panel-bg: #0f172a;
            --border-color: #334155;
            --icon-color: #94a3b8;
            --code-bg: #020617;    
            --code-text: #e2e8f0;  
        }

        body { 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; /* Changed from 150vh to remove forced gap */
            margin: 0;
            display: flex; 
            flex-direction: column; 
            transition: background 0.3s ease; 
            background: var(--body-bg);
            overflow-y: auto; 
        }

        nav { position: sticky; top: 0; z-index: 1000; flex-shrink: 0; }
        
        .main-content { 
            display: flex; 
            padding: 20px; 
            gap: 20px; 
            align-items: flex-start;
            min-height: calc(100vh - 80px); /* Ensures content area fills screen */
        }

        /* DOCUMENT PANEL */
        #doc-panel { 
            width: 55%; 
            height: 90vh; 
            position: sticky;
            top: 20px;
            display: flex;
            flex-direction: column;
            background: var(--studio-bg); 
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #doc-panel.fullscreen-doc {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            border-radius: 0;
        }

        #doc-viewport { 
            flex: 1;
            overflow: auto; 
            display: flex;
            justify-content: center; 
            align-items: flex-start; 
            padding: 0; 
        }

        #doc-page { 
            background: var(--paper-bg) !important;
            width: 210mm; 
            min-height: 297mm; 
            height: auto; 
            padding: 25mm; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transform: scale(0.8); 
            transform-origin: top center; 
            flex-shrink: 0; 
            color: var(--text-color) !important;
            margin-top: 20px; 
            margin-bottom: 40px; /* Reduced from 100px to remove bottom gap */
            transition: background 0.3s ease, color 0.3s ease;
        }

        #doc-container * { color: inherit !important; }
        
        .dark-mode #doc-container h1, 
        .dark-mode #doc-container h2, 
        .dark-mode #doc-container h3, 
        .dark-mode #doc-container strong,
        .dark-mode #doc-container b,
        .dark-mode #doc-container li,
        .dark-mode #doc-container p {
            color: var(--text-color) !important;
        }

        #doc-container pre { 
            background-color: var(--code-bg) !important; 
            padding: 24px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            margin: 24px 0; 
            overflow-x: auto;
        }
        
        #doc-container pre code { 
            color: var(--code-text) !important; 
            background: transparent !important; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap; 
        }

        /* GRAPH PANEL */
        #map-panel { 
            width: 45%; 
            height: 90vh; 
            position: sticky;
            top: 20px;
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        #map-panel.fullscreen-graph {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            border-radius: 0;
        }

        #cy-container { position: relative; flex-grow: 1; }
        #cy { width: 100%; height: 100%; outline: none; }

        .graph-title {
            position: absolute;
            top: 15px;
            left: 24px;
            z-index: 10;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--icon-color);
            pointer-events: none;
        }

        .graph-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            gap: 5px;
            z-index: 10;
        }

        .graph-btn {
            width: 35px;
            height: 35px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            color: #64748b;
        }
        .graph-btn:hover { background: #f8fafc; color: #3b82f6; }
        .dark-mode .graph-btn { background: #1e293b; color: #94a3b8; border-color: #334155; }

        .panel-header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .nav-icon { color: var(--icon-color); padding: 6px; cursor: pointer; background: none; border: none; font-size: 1.1rem; }
        .formal-blue-btn { background-color: #cbd5e1; color: #1e293b; font-weight: 800; }

        @media print {
            body, html { height: auto !important; overflow: visible !important; }
            nav, #map-panel, .panel-header, .graph-controls, .graph-title { display: none !important; }
            .main-content { display: block !important; padding: 0 !important; }
            #doc-panel { position: static !important; width: 100% !important; height: auto !important; border: none !important; overflow: visible !important; }
            #doc-viewport { overflow: visible !important; display: block !important; }
            #doc-page { transform: none !important; box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; }
        }
    </style>
</head>
<body id="main-body">

    <nav class="p-4 bg-[#334155] dark:bg-black flex justify-between items-center shadow-xl">
        <div class="flex items-center"><span class="text-white font-extrabold tracking-[0.5em] text-xl ml-6">RETRY</span></div>
        <div class="flex items-center rounded-xl overflow-hidden shadow-2xl bg-white">
            <input id="repo-url" type="text" placeholder="PASTE REPOSITORY LINK" class="px-6 py-3 text-sm w-[400px] outline-none border-none text-slate-700">
            <button onclick="ingestRepo()" id="btn-ingest" class="formal-blue-btn px-10 py-3 text-xs uppercase tracking-widest border-l border-slate-200">Analyze</button>
        </div>
        <button onclick="toggleDarkMode()" class="text-2xl mr-6">🌓</button>
    </nav>

    <div class="main-content">
        <div id="doc-panel" class="panel">
            <div class="panel-header">
                <div class="flex items-center gap-4">
                    <input type="range" min="0.4" max="1.5" step="0.05" value="0.80" id="zoomRange" oninput="updateZoom(this.value)">
                    <span id="zoomVal" class="text-[10px] font-bold text-slate-500">80%</span>
                </div>
                <div class="flex gap-3">
                    <button onclick="window.print()" class="nav-icon" title="Download PDF">📥</button>
                    <button onclick="toggleFocusMode()" class="nav-icon" title="Expand Document">⛶</button>
                </div>
            </div>
            <div id="doc-viewport">
                <div id="doc-page">
                    <div id="doc-container" class="prose max-w-none">
                        <div id="placeholder-text">
                            <h1 class="text-center">Repository Documentary</h1>
                            <p class="text-center italic mt-10 opacity-70">Awaiting analysis...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="map-panel" class="panel">
            <div class="panel-header">
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400">Visualization</span>
                <button onclick="toggleGraphFullscreen()" class="nav-icon" title="Expand Graph">⛶</button>
            </div>
            <div id="cy-container">
                <div class="graph-title">Dependency Graph</div>
                <div id="cy"></div>
                <div class="graph-controls">
                    <button class="graph-btn" style="grid-area: up" onclick="panGraph(0, 50)">▲</button>
                    <button class="graph-btn" style="grid-area: left" onclick="panGraph(50, 0)">◀</button>
                    <button class="graph-btn" style="grid-area: right" onclick="panGraph(-50, 0)">▶</button>
                    <button class="graph-btn" style="grid-area: down" onclick="panGraph(0, -50)">▼</button>
                </div>
                <div style="position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 5px; z-index: 10;">
                    <button class="graph-btn" onclick="zoomGraph(1.2)">+</button>
                    <button class="graph-btn" onclick="zoomGraph(0.8)">-</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cy = null;
        let isDarkMode = false;

        function toggleFocusMode() {
            const docPanel = document.getElementById('doc-panel');
            docPanel.classList.toggle('fullscreen-doc');
            if (cy) setTimeout(() => { cy.resize(); }, 400);
        }

        function toggleGraphFullscreen() {
            const mapPanel = document.getElementById('map-panel');
            mapPanel.classList.toggle('fullscreen-graph');
            if (cy) {
                setTimeout(() => {
                    cy.resize();
                    cy.fit();
                }, 350);
            }
        }

        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark-mode');
            if (cy) {
                cy.style()
                    .selector('node').style('color', isDarkMode ? '#f8fafc' : '#1e293b')
                    .selector('edge').style('line-color', isDarkMode ? '#475569' : '#cbd5e1').update();
            }
        }

        function zoomGraph(factor) { 
            if (cy) {
                const currentZoom = cy.zoom();
                cy.zoom({
                    level: currentZoom * factor,
                    renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 }
                });
            } 
        }

        function panGraph(x, y) { if (cy) cy.panBy({ x: x, y: y }); }

        function updateZoom(val) {
            const page = document.getElementById('doc-page');
            page.style.transform = `scale(${val})`;
            document.getElementById('zoomVal').innerText = Math.round(val * 100) + '%';
            page.style.marginTop = (val > 1) ? `${(val - 1) * 200 + 20}px` : '20px';
        }

        async function ingestRepo() {
            const url = document.getElementById('repo-url').value;
            if (!url) return;
            const btn = document.getElementById('btn-ingest');
            btn.innerText = "RUNNING";
            try {
                const res = await fetch('http://127.0.0.1:8000/ingest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url }) });
                const data = await res.json();
                const genRes = await fetch(`http://127.0.0.1:8000/generate/${data.repo}`);
                const genData = await genRes.json();
                document.getElementById('doc-container').innerHTML = `<div>${marked.parse(genData.markdown)}</div>`;
                loadGraph();
            } catch (e) { alert("Server Error"); }
            finally { btn.innerText = "Analyze"; }
        }

        async function loadGraph() {
            const res = await fetch('http://127.0.0.1:8000/graph-data');
            const elements = await res.json();
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                pixelRatio: 'auto', // High-quality rendering
                hideEdgesOnViewport: false,
                textureOnViewport: false,
                style: [
                    { 
                        selector: 'node', 
                        style: { 
                            'label': 'data(label)', 
                            'color': isDarkMode ? '#f8fafc' : '#1e293b', 
                            'font-size': '11px', 
                            'font-weight': '600',
                            'width': 22, 
                            'height': 22,
                            'background-color': (n) => n.data('label').includes('.') ? '#f59e0b' : '#3b82f6',
                            'text-valign': 'bottom', 
                            'text-margin-y': '8px',
                            'text-background-opacity': 0,
                            'text-background-color': '#ffffff',
                            'text-background-padding': '2px',
                            'border-width': 2,
                            'border-color': isDarkMode ? '#334155' : '#ffffff',
                            'overlay-padding': '4px',
                            'transition-property': 'background-color, line-color, target-arrow-color',
                            'transition-duration': '0.3s'
                        }
                    },
                    { 
                        selector: 'edge', 
                        style: { 
                            'width': 1.5, 
                            'line-color': isDarkMode ? '#475569' : '#cbd5e1', 
                            'target-arrow-shape': 'triangle', 
                            'target-arrow-color': isDarkMode ? '#475569' : '#cbd5e1',
                            'curve-style': 'bezier',
                            'arrow-scale': 1,
                            'opacity': 0.8
                        }
                    },
                    {
                        selector: 'node:selected',
                        style: {
                            'border-width': 4,
                            'border-color': '#3b82f6'
                        }
                    }
                ],
                layout: { 
                    name: 'cose', 
                    padding: 50, 
                    nodeOverlap: 20, 
                    componentSpacing: 100,
                    animate: true,
                    animationDuration: 500
                }
            });
            
            // Interaction to mimic Neo4j hover/click
            cy.on('mouseover', 'node', (e) => {
                e.target.style({'width': 28, 'height': 28});
            });
            cy.on('mouseout', 'node', (e) => {
                e.target.style({'width': 22, 'height': 22});
            });
        }

        window.onload = () => updateZoom(0.80);
    </script>
</body>
</html>
